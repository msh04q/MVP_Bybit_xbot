services:
- type: web
  name: MVP_Bybit_Pump_xbot
  runtime: python
  repo: https://github.com/msh04q/MVP_Bybit_xbot
  plan: free
  envVars:
  - key: TELEGRAM_TOKEN
    sync: false
  - key: BYBIT_API_SECRET
    sync: false
  - key: BYBIT_API_KEY
    sync: false
  region: frankfurt
  buildCommand: poetry install
  startCommand: poetry run python main.py
  autoDeployTrigger: commit
version: "1"
